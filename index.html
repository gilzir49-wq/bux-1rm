<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1410">
<title>השיאים שלי · באקס</title>
<style>
:root{
  --bg:#0d1410; --card:#16211a; --card2:#1d2b22; --line:#2a3b30;
  --text:#f2f5f0; --mute:#9fb0a4; --green:#1F5D24; --green2:#2f8a37;
  --gold:#F1C93B; --red:#e0574f; --blue:#58a6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;padding-bottom:40px}
button{font:inherit;color:var(--text);cursor:pointer;border:0}
input,select{font:inherit;color:var(--text)}
header{background:linear-gradient(135deg,var(--green),#123a16);padding:18px 16px 16px;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:22px}
header h1 span{color:var(--gold)}
header .sub{color:#d6e6d8;font-size:13px;margin-top:3px}
.hbtn{background:rgba(0,0,0,.25);color:#fff;padding:8px 12px;border-radius:10px;font-size:14px;white-space:nowrap}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:19px}
.card h3{margin:0 0 10px;font-size:17px}
label.l{display:block;color:var(--mute);font-size:14px;margin:10px 0 5px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0;font-size:17px}
.in:focus{outline:2px solid var(--gold);border-color:transparent}
.in:disabled{opacity:.4}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:var(--gold);color:#1a1a1a;padding:14px;border-radius:12px;font-weight:800;font-size:17px;margin-top:14px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:700}
.chk{display:flex;align-items:center;gap:8px;color:var(--text);font-size:16px;margin-top:10px}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.muted{color:var(--mute);font-size:14px}
.prof{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:14px;color:var(--text)}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:right;color:var(--text);min-height:74px}
.ex b{display:block;font-size:16px}
.ex small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.ex.has{border-color:var(--green2)}
.up{color:#5fd068;font-weight:800}
.down{color:var(--red);font-weight:800}
.eq{color:var(--mute);font-weight:800}
.new{color:var(--blue);font-weight:800}
.big{display:flex;align-items:baseline;gap:10px;margin:6px 0}
.big b{font-size:42px}
.res{border-radius:14px;padding:14px;text-align:center;font-size:20px;font-weight:800;margin:10px 0}
.res.up{background:rgba(47,138,55,.2);border:1px solid var(--green2)}
.res.down{background:rgba(224,87,79,.15);border:1px solid var(--red)}
.res.eq{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.res.new{background:rgba(88,166,255,.12);border:1px solid var(--blue)}
.hist .r{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .r:last-child{border:0}
.del{background:none;color:var(--mute);font-size:13px;text-decoration:underline;padding:2px 6px}
.back{background:none;color:var(--gold);font-weight:700;padding:4px 0;margin-bottom:8px}
.ulist .u{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ulist .u b{font-size:17px}
.ulist .exr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--text)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1a1a;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;display:none;max-width:90vw;text-align:center}
.foot{text-align:center;margin-top:20px}
.foot button{background:none;color:var(--mute);font-size:13px;text-decoration:underline}
</style>
</head>
<body>

<!-- ============================================================
     ✏️ לעריכה רק כאן: קוד מאמן, רשימת תרגילים, מקום שמירה
     ============================================================ -->
<script id="DATA">
const CLOUD = {
  url: "https://command-center-gal-default-rtdb.europe-west1.firebasedatabase.app",
  node: "bux-deadlift-1rm/v2",
  pin: "1234"            // ← קוד מאמן (לצפייה בכל המתאמנים)
};
const EXERCISES = [
  "דדליפט","סקוואט אחורי","סקוואט קדמי","אוברהד סקוואט",
  "לחיצת חזה","לחיצת כתפיים","פוש פרס","ג׳רק",
  "קלין","פאוור קלין","קלין אנד ג׳רק","סנאץ׳","פאוור סנאץ׳","ת׳ראסטר"
];
</script>

<header>
  <div><h1>🏋️ השיאים <span>שלי</span></h1><div class="sub">קרוספיט באקס</div></div>
  <button class="hbtn" id="hBtn" onclick="logout()" style="display:none">יציאה</button>
</header>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ===== מצב =====
const base = CLOUD.url+'/'+CLOUD.node+'/users';
let ME=null, USER=null, VIEW='home', EX=null, COACH=false;
try{ ME=localStorage.getItem('pr_me'); }catch(e){}

const $ = id => document.getElementById(id);
const fmt = n => (Math.round(n*10)/10).toString();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('he-IL',{day:'numeric',month:'numeric',year:'2-digit'});
const norm = s => s.trim().replace(/\s+/g,' ');
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600);}

// ===== ענן — כל מתאמן שמור בנפרד =====
async function getAll(){ const r=await fetch(base+'.json'); if(!r.ok) throw 0; return (await r.json())||{}; }
async function getUser(id){ const r=await fetch(base+'/'+id+'.json'); if(!r.ok) throw 0; return fix(await r.json()); }
async function saveUser(){
  try{ const r=await fetch(base+'/'+ME+'.json',{method:'PUT',body:JSON.stringify(USER)}); if(!r.ok)throw 0; return true; }
  catch(e){ toast('⚠️ לא נשמר — בדוק אינטרנט ונסה שוב'); return false; }
}
function fix(u){ if(!u) return null; u.ex=u.ex||{}; for(const k in u.ex){ const h=u.ex[k]; u.ex[k]=(Array.isArray(h)?h:Object.values(h||{})).map(r=>({v:r.v??null,d:r.d})); } return u; }
const exKey = name => name.replace(/[.#$\[\]\/]/g,'_');

// ===== השוואת תוצאות =====
// היסטוריה של תרגיל: [{v: מספר או null (=לא זכור), d: תאריך}]
function cmp(h){
  if(!h||!h.length) return null;
  const last=h[h.length-1]; if(h.length<2) return {k:'eq',last:last.v,txt:''};
  const prev=h[h.length-2];
  if(prev.v==null) return {k:'new',last:last.v,txt:'🆕 שיא ראשון נקבע'};
  const d=last.v-prev.v, p=prev.v?Math.round(d/prev.v*1000)/10:0;
  if(d>0) return {k:'up',last:last.v,prev:prev.v,txt:`⬆️ עלייה של ${fmt(d)} ק״ג (+${p}%)`};
  if(d<0) return {k:'down',last:last.v,prev:prev.v,txt:`⬇️ ירידה של ${fmt(-d)} ק״ג (${p}%)`};
  return {k:'eq',last:last.v,prev:prev.v,txt:'⏸️ ללא שינוי'};
}
const bw = v => USER&&USER.w&&v ? ` · פי ${fmt(v/USER.w)} ממשקל הגוף` : '';

// ===== מסכים =====
function render(){
  $('hBtn').style.display = (USER||COACH)?'':'none';
  $('hBtn').textContent = COACH?'יציאה ממצב מאמן':'יציאה';
  if(COACH) return coachView();
  if(!USER) return loginView();
  if(VIEW==='profile') return profileView();
  if(VIEW==='ex') return exView();
  homeView();
}

function loginView(){
  $('app').innerHTML=`
  <div class="card"><h2>👋 כניסת מתאמן</h2>
    <label class="l">שם מלא</label>
    <input class="in" id="lName" placeholder="לדוגמה: שני כהן" autocomplete="name">
    <label class="l">קוד אישי (4 ספרות)</label>
    <input class="in" id="lCode" type="tel" inputmode="numeric" maxlength="4" placeholder="נכנס ראשונה? בחר קוד שתזכור">
    <div class="muted" style="margin-top:8px">הקוד שומר שרק אתה תוכל לעדכן את התוצאות שלך.</div>
    <button class="btn" onclick="login()">כניסה</button>
  </div>`;
}
async function login(){
  const name=norm($('lName').value), code=$('lCode').value.trim();
  if(name.length<2) return toast('חסר שם');
  if(!/^\d{4}$/.test(code)) return toast('קוד של 4 ספרות');
  let all; try{ all=await getAll(); }catch(e){ return toast('⚠️ אין חיבור לאינטרנט'); }
  const hit=Object.entries(all).find(([,u])=>norm(u.name)===name);
  if(hit){
    if(hit[1].code!==code) return toast('הקוד לא נכון לשם הזה');
    ME=hit[0]; USER=fix(hit[1]);
  } else {
    ME='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    USER={name,code,ex:{},t:Date.now()};
    if(!await saveUser()) return;
    VIEW='profile';
  }
  try{ localStorage.setItem('pr_me',ME); }catch(e){}
  render();
}
function logout(){ ME=null;USER=null;COACH=false;VIEW='home';try{localStorage.removeItem('pr_me')}catch(e){} render(); }

function profileView(){
  const u=USER;
  $('app').innerHTML=`
  <button class="back" onclick="go('home')">→ ${u.h||u.w||u.age?'חזרה':'דלג, אמלא אחר כך'}</button>
  <div class="card"><h2>📋 הפרטים שלי</h2>
    <div class="muted">לא חובה, אבל עוזר להשוות התקדמות (למשל כמה אתה מרים ביחס למשקל הגוף).</div>
    <div class="three" style="margin-top:6px">
      <div><label class="l">גובה (ס״מ)</label><input class="in" id="pH" type="number" inputmode="numeric" value="${u.h||''}"></div>
      <div><label class="l">משקל (ק״ג)</label><input class="in" id="pW" type="number" inputmode="decimal" value="${u.w||''}"></div>
      <div><label class="l">גיל</label><input class="in" id="pA" type="number" inputmode="numeric" value="${u.age||''}"></div>
    </div>
    <button class="btn" onclick="saveProfile()">שמירה</button>
  </div>`;
}
async function saveProfile(){
  const num=id=>{const v=parseFloat($(id).value);return v>0?v:null;};
  USER.h=num('pH'); USER.w=num('pW'); USER.age=num('pA');
  if(await saveUser()){ toast('נשמר ✓'); go('home'); }
}
function go(v,ex){ VIEW=v; if(ex!==undefined)EX=ex; render(); scrollTo(0,0); }
function openEx(i){ go('ex', allEx()[i]); }
function allEx(){ return [...EXERCISES, ...Object.values(USER.exNames||{}).filter(n=>!EXERCISES.includes(n))]; }

function homeView(){
  const u=USER;
  const tiles=allEx().map((n,i)=>{
    const h=u.ex[exKey(n)], c=cmp(h);
    const ic={up:'⬆️',down:'⬇️',new:'🆕'}[c&&c.k]||'';
    const sub = !c ? 'עוד לא הוזן' : c.last==null ? 'לא זכור' : `${fmt(c.last)} ק״ג ${ic?`<span class="${c.k}">${ic}</span>`:''}`;
    return `<button class="ex ${c?'has':''}" onclick="openEx(${i})"><b>${esc(n)}</b><small>${sub}</small></button>`;
  }).join('');
  $('app').innerHTML=`
  <div class="card"><h2>היי ${esc(u.name)} 💪</h2>
    <div class="prof">
      ${u.h?`<span class="chip">📏 ${fmt(u.h)} ס״מ</span>`:''}${u.w?`<span class="chip">⚖️ ${fmt(u.w)} ק״ג</span>`:''}${u.age?`<span class="chip">🎂 גיל ${fmt(u.age)}</span>`:''}
      <button class="chip" onclick="go('profile')">✏️ ${u.h||u.w||u.age?'עדכון פרטים':'הוספת גובה, משקל וגיל'}</button>
    </div>
  </div>
  <div class="card"><h3>בחר תרגיל להזנת תוצאה</h3>
    <div class="exgrid">${tiles}</div>
    <label class="l">תרגיל אחר</label>
    <div class="two"><input class="in" id="newEx" placeholder="שם התרגיל"><button class="btn ghost" style="margin:0" onclick="addEx()">➕ הוסף</button></div>
  </div>`;
}
async function addEx(){
  const n=norm($('newEx').value); if(n.length<2) return toast('חסר שם תרגיל');
  USER.exNames=USER.exNames||{}; USER.exNames[exKey(n)]=n;
  if(await saveUser()) go('ex',n);
}

function exView(){
  const k=exKey(EX), h=USER.ex[k]||[], c=cmp(h);
  const first=!h.length;
  const rows=h.map((r,i)=>({...r,i})).reverse().map(r=>`<div class="r"><span>${esc(r.d)}</span><span><b>${r.v==null?'לא זכור':fmt(r.v)+' ק״ג'}</b>${r.i===h.length-1?` <button class="del" onclick="delLast()">מחיקה</button>`:''}</span></div>`).join('');
  $('app').innerHTML=`
  <button class="back" onclick="go('home')">→ כל התרגילים</button>
  <div class="card"><h2>${esc(EX)}</h2>
    ${c&&c.last!=null?`<div class="big"><b>${fmt(c.last)}</b><span>ק״ג · אחרון${bw(c.last)}</span></div>`:''}
    ${c&&c.txt?`<div class="res ${c.k}">${c.txt}</div>`:''}
    ${first?`
      <label class="l">התוצאה הקודמת שלך (ק״ג)</label>
      <input class="in" id="ePrev" type="number" inputmode="decimal" placeholder="השיא שהיה לך">
      <label class="chk"><input type="checkbox" id="eNo" onchange="$('ePrev').disabled=this.checked;if(this.checked)$('ePrev').value=''"> לא זכור</label>`:''}
    <label class="l">${first?'התוצאה החדשה שעשית היום (ק״ג)':'תוצאה חדשה (ק״ג)'}</label>
    <input class="in" id="eNow" type="number" inputmode="decimal" placeholder="כמה הרמת">
    <button class="btn" onclick="addRes(${first})">שמירה</button>
  </div>
  ${h.length?`<div class="card hist"><h3>📈 ההיסטוריה שלי</h3>${rows}</div>`:''}`;
}
async function addRes(first){
  const k=exKey(EX), now=parseFloat($('eNow').value);
  if(!(now>0)) return toast('לרשום את התוצאה החדשה');
  const h=[...(USER.ex[k]||[])];
  if(first){
    const no=$('eNo').checked, prev=parseFloat($('ePrev').value);
    if(!no && !(prev>0)) return toast('לרשום תוצאה קודמת, או לסמן "לא זכור"');
    h.push({v:no?null:prev,d:'לפני'});
  }
  h.push({v:now,d:today()});
  const old=USER.ex[k]; USER.ex[k]=h; USER.t=Date.now();
  if(await saveUser()){ const c=cmp(h); toast(c.k==='up'?'🔥 שיא חדש! כל הכבוד':'נשמר ✓'); render(); }
  else USER.ex[k]=old;
}
async function delLast(){
  const k=exKey(EX), h=[...(USER.ex[k]||[])]; if(!h.length) return;
  if(!confirm('למחוק את התוצאה האחרונה?')) return;
  h.pop(); if(h.length===1 && h[0].d==='לפני') h.pop();   // בלי תוצאה חדשה אין טעם בקודמת
  const old=USER.ex[k]; USER.ex[k]=h; if(await saveUser()) render(); else USER.ex[k]=old;
}

// ===== מצב מאמן — צפייה בכולם =====
function coachLogin(){ const p=prompt('קוד מאמן:'); if(p===null) return; if(p!==CLOUD.pin) return toast('קוד שגוי'); COACH=true; render(); }
async function coachView(){
  $('app').innerHTML='<div class="card muted">טוען…</div>';
  let all; try{ all=await getAll(); }catch(e){ $('app').innerHTML='<div class="card">⚠️ אין חיבור</div>'; return; }
  const us=Object.values(all).map(fix).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  $('app').innerHTML=`<div class="card"><h2>👀 כל המתאמנים (${us.length})</h2><div class="muted">מוצג רק מה שהמתאמנים הזינו בעצמם.</div></div>
  <div class="ulist">${us.map(u=>{
    const exs=Object.entries(u.ex).filter(([,h])=>h.length).map(([k,h])=>{const c=cmp(h);const n=(u.exNames||{})[k]||k;
      const tag=c.k==='up'?'⬆️ +'+fmt(c.last-c.prev):c.k==='down'?'⬇️ '+fmt(c.last-c.prev):c.k==='new'?'🆕':'';
      return `<div class="exr"><span>${esc(n)}</span><span>${c.last==null?'—':fmt(c.last)+' ק״ג'} <span class="${c.k}">${tag}</span></span></div>`;}).join('');
    return `<div class="u"><b>${esc(u.name)}</b><div class="muted">${[u.h&&fmt(u.h)+' ס״מ',u.w&&fmt(u.w)+' ק״ג',u.age&&'גיל '+fmt(u.age)].filter(Boolean).join(' · ')||'בלי פרטים'}</div>${exs||'<div class="muted">עוד לא הזין תוצאות</div>'}</div>`;}).join('')}</div>`;
}

// ===== הפעלה =====
(async()=>{
  if(ME){ try{ USER=await getUser(ME); if(!USER) ME=null; }catch(e){ toast('⚠️ אין חיבור'); } }
  render();
  const f=document.createElement('div'); f.className='foot'; f.innerHTML='<button onclick="coachLogin()">🔒 כניסת מאמן</button>'; document.body.appendChild(f);
})();
</script>
</body>
</html>
