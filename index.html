<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3a1e">
<title>יומן השיאים שלי · באקס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#24402f; --board2:#1d3527;
  --chalk:#f6e27f;                 /* גיר צהוב */
  --white:rgba(244,242,230,.82);   /* גיר לבן */
  --line:rgba(246,226,127,.55);
  --soft:rgba(246,226,127,.10);
  --up:#b9f0a4; --down:#ffa391; --new:#a9d8ff;
  --wood:#6b4423; --wood2:#4a2e16;
  --hand:'Amatic SC', 'Comic Sans MS', cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:linear-gradient(135deg,var(--wood),var(--wood2) 60%,var(--wood));min-height:100%}
body{
  margin:10px;min-height:calc(100vh - 20px);border-radius:6px;
  background:
    radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.07),transparent 45%),
    radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.05),transparent 50%),
    radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.25),transparent 60%),
    linear-gradient(160deg,var(--board),var(--board2));
  box-shadow:inset 0 0 50px rgba(0,0,0,.55),0 0 0 4px var(--wood2),0 8px 30px rgba(0,0,0,.5);
  color:var(--chalk);font-family:var(--hand);font-weight:700;font-size:23px;line-height:1.25;
  padding-bottom:30px;letter-spacing:.3px
}
/* ניחוח גיר: הילה רכה סביב הכיתוב */
body,button,input,select{text-shadow:0 0 1px rgba(246,226,127,.7),0 0 7px rgba(246,226,127,.18)}
button{font:inherit;color:var(--chalk);cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--chalk)}
::placeholder{color:rgba(246,226,127,.38)}
/* מסגרת "מצוירת ביד" */
.hd{border:2px solid var(--line);border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.hd2{border:2px solid var(--line);border-radius:14px 225px 14px 255px/255px 14px 225px 14px}

header{padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:44px;line-height:1}
header .sub{color:var(--white);font-size:22px}
.hbtn{color:var(--white);font-size:21px;text-decoration:underline;padding:6px}
.scribble{height:10px;margin:0 18px 6px;border-bottom:3px solid var(--line);border-radius:0 0 50% 40%/0 0 10px 6px;opacity:.8}
.wrap{max-width:640px;margin:0 auto;padding:10px 16px}
.card{padding:16px 18px;margin-bottom:16px;background:rgba(0,0,0,.08)}
.card h2{margin:0 0 8px;font-size:36px;line-height:1.05}
.card h3{margin:0 0 8px;font-size:30px}
label.l{display:block;color:var(--white);font-size:23px;margin:10px 0 4px}
.in{width:100%;background:rgba(0,0,0,.18);border:0;border-bottom:2px dashed var(--line);border-radius:4px;padding:8px 10px;min-width:0;font-size:28px}
.in:focus{outline:none;background:rgba(0,0,0,.28);border-bottom-style:solid}
.in:disabled{opacity:.35}
select.in{appearance:auto;background:rgba(0,0,0,.25)}
select.in option{background:#1d3527;color:#f6e27f}
input[type=date].in{font-size:24px;color-scheme:dark}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.tm{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:center}
.btn{display:block;width:100%;background:var(--chalk);color:var(--board2);text-shadow:none;padding:10px;font-size:32px;margin-top:16px;border-radius:255px 14px 225px 14px/14px 225px 14px 255px}
.btn.ghost{background:var(--soft);color:var(--chalk);border:2px dashed var(--line);font-size:26px;padding:6px;text-shadow:inherit}
.chk{display:flex;align-items:center;gap:10px;color:var(--white);font-size:26px;margin-top:10px}
.chk input{width:22px;height:22px;accent-color:var(--chalk);flex:none}
.muted{color:var(--white);font-size:22px}
.prof{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.chip{padding:2px 12px;font-size:23px;color:var(--white);border:2px solid rgba(244,242,230,.4);border-radius:30px 8px 30px 8px/8px 30px 8px 30px}
.chip.on{color:var(--board2);background:var(--chalk);text-shadow:none;border-color:var(--chalk)}
.tabs{display:flex;gap:10px;margin:0 0 14px}
.tabs button{flex:1;font-size:28px;padding:6px;color:var(--white)}
.tabs button.on{color:var(--board2);background:var(--chalk);text-shadow:none}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ex{padding:10px 12px;text-align:right;min-height:78px;background:rgba(0,0,0,.08)}
.ex:nth-child(odd){transform:rotate(-.6deg)} .ex:nth-child(even){transform:rotate(.5deg)}
.ex b{display:block;font-size:27px;line-height:1}
.ex small{display:block;color:var(--white);font-size:22px;margin-top:4px}
.ex.has{background:var(--soft)}
.grp{color:var(--white);font-size:24px;margin:14px 0 6px;border-bottom:2px dashed rgba(246,226,127,.25)}
.up{color:var(--up)} .down{color:var(--down)} .eq{color:var(--white)} .new{color:var(--new)}
.big{display:flex;align-items:baseline;gap:10px;margin:2px 0;flex-wrap:wrap}
.big b{font-size:72px;line-height:1}
.big span{color:var(--white)}
.res{padding:8px 12px;text-align:center;font-size:30px;margin:10px 0}
.res.up{border-color:var(--up)} .res.down{border-color:var(--down)} .res.new{border-color:var(--new)}
.chart{width:100%;height:160px;display:block;margin:6px 0}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pct{text-align:center;padding:4px;border:2px dashed rgba(246,226,127,.3);border-radius:10px}
.pct small{display:block;color:var(--white);font-size:20px}
.pct b{font-size:28px}
.r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:2px dashed rgba(246,226,127,.25)}
.r:last-child{border:0}
.r .dt{color:var(--white);font-size:22px;white-space:nowrap}
.r .nt{display:block;color:var(--white);font-size:21px;font-weight:400}
.r .vv{text-align:left;white-space:nowrap}
.rk{width:40px;flex:none;font-size:30px;text-align:center}
.del{color:var(--white);font-size:19px;text-decoration:underline;padding:0 4px;opacity:.75}
.back{color:var(--chalk);font-size:26px;padding:4px 0;margin-bottom:6px;text-decoration:underline}
.banner{display:block;width:100%;text-align:center;padding:10px;margin-bottom:16px;font-size:30px;background:var(--soft)}
.coachbar{background:var(--chalk);color:var(--board2);text-shadow:none;padding:6px 12px;margin-bottom:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;font-size:24px}
.coachbar button{color:var(--board2);text-shadow:none;text-decoration:underline}
.u{padding:12px 14px;margin-bottom:12px}
.u b{font-size:30px}
.exr{display:flex;justify-content:space-between;font-size:23px;padding:2px 0}
.lnk{color:var(--chalk);text-decoration:underline;font-size:22px;padding:2px 6px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--chalk);color:var(--board2);text-shadow:none;padding:8px 18px;font-size:28px;z-index:9;display:none;max-width:90vw;text-align:center;border-radius:255px 14px 225px 14px/14px 225px 14px 255px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.foot{text-align:center;margin-top:18px}
.foot button{color:var(--white);font-size:20px;text-decoration:underline}
.empty{color:var(--white);text-align:center;padding:8px}
@media(max-width:380px){body{font-size:21px}.exgrid{gap:8px}.ex b{font-size:24px}.pcts{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<!-- ============================================================
     ✏️ לעריכה רק כאן: קוד מאמן, רשימת תרגילים, מקום שמירה
     סוגי תרגיל: kg = קילו · reps = חזרות · time = זמן (פחות = טוב יותר) · dist = מטרים
     ============================================================ -->
<script id="DATA">
const CLOUD = {
  url: "https://command-center-gal-default-rtdb.europe-west1.firebasedatabase.app",
  node: "bux-deadlift-1rm/v2",
  pinHash: "091205eb007cb9e49ecc4e1850b891097d6cfe92f82baaa148b797d50eae25b1"   // ← קוד מאמן (שמור מוצפן; לשינוי — לבקש מקלוד)
};
const EXERCISES = [
  {n:"דדליפט",t:"kg"},{n:"סקוואט אחורי",t:"kg"},{n:"סקוואט קדמי",t:"kg"},{n:"אוברהד סקוואט",t:"kg"},
  {n:"לחיצת חזה",t:"kg"},{n:"לחיצת כתפיים",t:"kg"},{n:"פוש פרס",t:"kg"},{n:"ג׳רק",t:"kg"},
  {n:"קלין",t:"kg"},{n:"פאוור קלין",t:"kg"},{n:"קלין אנד ג׳רק",t:"kg"},{n:"סנאץ׳",t:"kg"},
  {n:"פאוור סנאץ׳",t:"kg"},{n:"ת׳ראסטר",t:"kg"},
  {n:"מתח — מקסימום חזרות",t:"reps"},{n:"שכיבות סמיכה — מקסימום",t:"reps"},{n:"דיפס — מקסימום",t:"reps"},
  {n:"ריצת 400 מ׳",t:"time"},{n:"ריצת 5 ק״מ",t:"time"},{n:"חתירה 500 מ׳",t:"time"},{n:"חתירה 2 ק״מ",t:"time"},
  {n:"חתירה — מרחק בדקה",t:"dist"}
];
const PCTS = [50,60,70,75,80,85,90,95];   // מחשבון אחוזים מהשיא
</script>

<header>
  <div><h1>יומן השיאים שלי</h1><div class="sub">קרוספיט באקס · 1RM</div></div>
  <button class="hbtn" id="hBtn" onclick="logout()" style="display:none">יציאה</button>
</header>
<div class="scribble"></div>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ===== מצב =====
const base   = CLOUD.url+'/'+CLOUD.node+'/users';
const evBase = CLOUD.url+'/'+CLOUD.node+'/events';
let ME=null, USER=null, VIEW='home', EX=null, TAB='mine';
let COACH=false, AS_COACH=false;     // AS_COACH = המאמן פתח יומן של מתאמן
let EVENTS={}, BOARD_EX='דדליפט', BOARD_G='', EV=null;
try{ ME=localStorage.getItem('pr_me'); COACH=sessionStorage.getItem('pr_coach')==='1'; }catch(e){}

const $ = id => document.getElementById(id);
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoToday = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const ISO_RE=/^\d{4}-\d{2}-\d{2}$/, ID_RE=/^[ue][a-z0-9]{4,24}$/;
const showDate = iso => { if(!iso) return 'לפני'; if(!ISO_RE.test(iso)) return '?'; const [y,m,d]=iso.split('-'); return `${+d}.${+m}.${y.slice(2)}`; };
// קוד אישי לא נשמר כמו שהוא — רק טביעה מוצפנת שלו
async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const codeHash = (name,code) => sha('bux1rm|'+norm(name)+'|'+code);
const norm = s => s.trim().replace(/\s+/g,' ');
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600);}

// ===== סוגי תרגילים ויחידות =====
const exKey = name => name.replace(/[.#$\[\]\/]/g,'_');
const UNIT = {kg:'ק״ג',reps:'חזרות',time:'',dist:'מ׳'};
const mmss = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0'); return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`; };
const show = (v,t) => v==null ? 'לא זכור' : t==='time' ? mmss(v) : `${r1(v)} ${UNIT[t]}`;
const showD = (d,t) => t==='time' ? mmss(Math.abs(d)) : `${r1(Math.abs(d))} ${UNIT[t]}`;
const better = (a,b,t) => t==='time' ? a<b : a>b;          // האם a טוב יותר מ-b
function typeOf(u,name){ const b=EXERCISES.find(e=>e.n===name); return b?b.t:((u&&u.exTypes||{})[exKey(name)]||'kg'); }
const exName = (u,k) => (u.exNames||{})[k] || (EXERCISES.find(e=>exKey(e.n)===k)||{}).n || k;
function allEx(u){ const extra=Object.values(u.exNames||{}).filter(n=>!EXERCISES.some(e=>e.n===n)).map(n=>({n,t:typeOf(u,n)})); return [...EXERCISES,...extra]; }

// ===== ענן — כל מתאמן שמור בנפרד =====
async function j(url,opt){ const r=await fetch(url,opt); if(!r.ok) throw 0; return r.json(); }
// מסננים רשומות שלא נוצרו ע״י האפליקציה (הגנה מפני הזרקת קוד)
const getAll  = async()=> Object.fromEntries(Object.entries((await j(base+'.json'))||{}).filter(([id,u])=>ID_RE.test(id)&&u&&typeof u.name==='string'));
const getUser = async id => fix(await j(base+'/'+id+'.json'));
async function saveUser(){
  try{ await j(base+'/'+ME+'.json',{method:'PUT',body:JSON.stringify(USER)}); return true; }
  catch(e){ toast('⚠️ לא נשמר — בדוק אינטרנט ונסה שוב'); return false; }
}
async function loadEvents(){ try{ const d=(await j(evBase+'.json'))||{}; EVENTS=Object.fromEntries(Object.entries(d).filter(([id,e])=>ID_RE.test(id)&&e&&EXERCISES.some(x=>x.n===e.ex)&&ISO_RE.test(e.iso))); }catch(e){} }
// רשומה ביומן: {v: מספר או null (=לא זכור), iso: תאריך או ריק (=התוצאה מלפני), note}
function fix(u){
  if(!u) return null; u.ex=(u.ex&&typeof u.ex==='object')?u.ex:{};
  u.name=String(u.name||'').slice(0,40);
  const okT=['kg','reps','time','dist'];
  u.exNames=Object.fromEntries(Object.entries(u.exNames||{}).map(([k,n])=>[k,String(n).slice(0,60)]));
  u.exTypes=Object.fromEntries(Object.entries(u.exTypes||{}).filter(([,t])=>okT.includes(t)));
  for(const f of ['h','w','age']) if(u[f]!=null && !isFinite(Number(u[f]))) u[f]=null;
  if(!['m','f',''].includes(u.g||'')) u.g='';
  for(const k in u.ex){
    const h=u.ex[k];
    u.ex[k]=(Array.isArray(h)?h:Object.values(h||{})).map(r=>{
      let iso=r.iso||null;
      if(!iso && r.d && r.d!=='לפני'){ const m=r.d.split('.'); if(m.length===3) iso=`20${m[2]}-${m[1].padStart(2,'0')}-${m[0].padStart(2,'0')}`; }
      const v=Number(r.v); return {v:r.v==null||!isFinite(v)?null:v, iso:ISO_RE.test(iso||'')?iso:null, note:String(r.note||'').slice(0,80)};
    });
  }
  return u;
}
const sortH = h => h.sort((a,b)=> (a.iso?1:0)-(b.iso?1:0) || String(a.iso).localeCompare(String(b.iso)));

// ===== השוואת תוצאות =====
function cmpPair(prev,last,t){
  if(!prev) return {k:'eq',txt:''};
  if(prev.v==null) return {k:'new',txt:'★ שיא ראשון נקבע'};
  const d=last.v-prev.v;
  if(d===0) return {k:'eq',d,txt:'= ללא שינוי'};
  const good=better(last.v,prev.v,t), p=prev.v?Math.round(Math.abs(d)/prev.v*1000)/10:0;
  if(t==='time') return {k:good?'up':'down',d,txt:good?`▲ מהר יותר ב־${mmss(Math.abs(d))}`:`▼ איטי יותר ב־${mmss(Math.abs(d))}`};
  return {k:good?'up':'down',d,txt:`${good?'▲ עלייה':'▼ ירידה'} של ${showD(d,t)} (${good?'+':'−'}${p}%)`};
}
function cmp(h,t){
  if(!h||!h.length) return null;
  const last=h[h.length-1];
  return {...cmpPair(h[h.length-2],last,t), last:last.v, prev:h.length>1?h[h.length-2].v:null};
}
const bestOf = (h,t) => { const v=(h||[]).filter(r=>r.v!=null); if(!v.length) return null; return v.reduce((a,b)=>better(b.v,a.v,t)?b:a); };
const tag = (c,t) => !c ? '' : c.k==='new' ? 'חדש!' : c.k==='eq' ? '' : (c.k==='up'?'▲ ':'▼ ')+showD(c.d,t);

// ===== ניתוב מסכים =====
function render(){
  $('hBtn').style.display = (USER||COACH)?'':'none';
  $('hBtn').textContent = COACH?'יציאה ממצב מאמן':'יציאה';
  if(COACH && !AS_COACH){ return VIEW==='event'?eventView():coachView(); }
  if(!USER) return loginView();
  if(VIEW==='profile') return profileView();
  if(VIEW==='ex') return exView();
  homeView();
}
function go(v,ex){ VIEW=v; if(ex!==undefined)EX=ex; render(); scrollTo(0,0); }
const coachBar = () => AS_COACH ? `<div class="coachbar"><span>✎ מצב מאמן: היומן של ${esc(USER.name)}</span><button onclick="leaveAthlete()">לרשימה</button></div>` : '';

// ===== כניסה =====
function loginView(){
  $('app').innerHTML=`
  <div class="card hd"><h2>כניסת מתאמן</h2>
    <label class="l">שם מלא</label>
    <input class="in" id="lName" placeholder="לדוגמה: שני כהן" autocomplete="name">
    <label class="l">קוד אישי (4 ספרות)</label>
    <input class="in" id="lCode" type="tel" inputmode="numeric" maxlength="4" placeholder="פעם ראשונה? בחר קוד שתזכור">
    <div class="muted" style="margin-top:8px">הקוד שומר שרק אתה תוכל לכתוב ביומן שלך. שכחת? המאמן יכול לאפס.</div>
    <button class="btn" onclick="login()">כניסה ליומן</button>
  </div>`;
}
async function login(){
  const name=norm($('lName').value), code=$('lCode').value.trim();
  if(name.length<2) return toast('חסר שם');
  if(name.length>40) return toast('שם ארוך מדי');
  if(!/^\d{4}$/.test(code)) return toast('קוד של 4 ספרות');
  let all; try{ all=await getAll(); }catch(e){ return toast('⚠️ אין חיבור לאינטרנט'); }
  const hit=Object.entries(all).find(([,u])=>norm(u.name)===name);
  if(hit){
    const hc=await codeHash(name,code);
    if(hit[1].code!==hc && hit[1].code!==code) return toast('הקוד לא נכון לשם הזה');
    if(hit[1].code===code){ hit[1].code=hc; try{ await j(base+'/'+hit[0]+'/code.json',{method:'PUT',body:JSON.stringify(hc)}); }catch(e){} }   // משדרגים קוד ישן לטביעה מוצפנת
    ME=hit[0]; USER=fix(hit[1]); VIEW='home';
  } else {
    ME='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    USER={name,code:await codeHash(name,code),ex:{},t:Date.now(),pub:false};
    if(!await saveUser()) return;
    VIEW='profile';
  }
  try{ localStorage.setItem('pr_me',ME); }catch(e){}
  render();
}
function logout(){
  if(COACH){ COACH=false; AS_COACH=false; try{sessionStorage.removeItem('pr_coach')}catch(e){} USER=null; try{ ME=localStorage.getItem('pr_me'); }catch(e){ ME=null; } VIEW='home'; boot(); return; }
  ME=null;USER=null;VIEW='home';TAB='mine';try{localStorage.removeItem('pr_me')}catch(e){} render();
}

// ===== פרטים אישיים =====
function profileView(){
  const u=USER, g=u.g||'';
  $('app').innerHTML=`${coachBar()}
  <button class="back" onclick="go('home')">→ ${u.h||u.w||u.age?'חזרה':'דלג, אמלא אחר כך'}</button>
  <div class="card hd"><h2>הפרטים שלי</h2>
    <div class="muted">לא חובה. גובה, משקל וגיל גלויים רק לך ולמאמן.</div>

// ===== עמוד תרגיל =====
function chart(h,t){
  const pts=h.filter(r=>r.v!=null); if(pts.length<2) return '';
  const W=600,H=160,P=36, vs=pts.map(r=>r.v), mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  const yOf=v=> t==='time' ? P+((v-mn)/rg)*(H-2*P) : H-P-((v-mn)/rg)*(H-2*P);   // בזמן — למעלה = מהר יותר
  const xy=pts.map((r,i)=>[W-P-(i*(W-2*P)/(pts.length-1)), yOf(r.v)]);           // ימין → שמאל
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="גרף התקדמות">
    <polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#f6e27f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 3" opacity=".9"/>
    ${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#f6e27f"/><text x="${p[0]}" y="${p[1]-12}" fill="#f6e27f" font-family="Amatic SC" font-weight="700" font-size="24" text-anchor="middle">${t==='time'?mmss(pts[i].v):r1(pts[i].v)}</text>`).join('')}
  </svg>`;
}

  return `<input class="in" id="${id}" type="number" inputmode="decimal" placeholder="${ph}">`;
}
function readVal(id,t){

}

async function addRes(first){
  const t=typeOf(USER,EX), k=exKey(EX), now=readVal('eNow',t), iso=$('eDate').value||isoToday(), note=$('eNote').value.trim();
  if(!(now>0)) return toast('לכתוב את התוצאה החדשה');
  const h=[...(USER.ex[k]||[])];
  if(first){
    const no=$('eNo').checked, prev=readVal('ePrev',t);
    if(!no && !(prev>0)) return toast('לכתוב תוצאה קודמת, או לסמן "לא זכור"');
    h.push({v:no?null:prev,iso:null,note:''});
  }
  const pb=bestOf(h,t);
  h.push({v:now,iso,note});
  sortH(h);
  const old=USER.ex[k]; USER.ex[k]=h; USER.t=Date.now();
  if(await saveUser()){ toast(pb&&better(now,pb.v,t)?'🔥 שיא חדש! כל הכבוד':'נכתב ביומן ✓'); render(); }
  else USER.ex[k]=old;
}

  rows.sort((a,b)=>ord[a.c.k]-ord[b.c.k] || (a.c.k==='up'?Math.abs(b.c.d)-Math.abs(a.c.d):0));
  const up=rows.filter(x=>x.c.k==='up'), nw=rows.filter(x=>x.c.k==='new');
  window._share=`🏋️ *יום בדיקות ${e.ex} — קרוספיט באקס* (${showDate(e.iso)})\n\n`+
    (up.length?'🔥 *שברו שיא:*\n'+up.map(x=>`• ${x.u.name}: ${show(x.r.v,t)} (${tag(x.c,t)})`).join('\n')+'\n\n':'')+
    (nw.length?'★ *שיא ראשון נקבע:*\n'+nw.map(x=>`• ${x.u.name}: ${show(x.r.v,t)}`).join('\n')+'\n\n':'')+'כל הכבוד לכולם 💪💛💚';
  $('app').innerHTML=`<button class="back" onclick="go('coach')">→ חזרה</button>
  <div class="card hd"><h2>${esc(e.ex)} · ${showDate(e.iso)}</h2>
    <div class="prof"><span class="chip">${rows.length} כתבו</span><span class="chip">${up.length} שברו שיא</span><span class="chip">${nw.length} שיא ראשון</span></div>
    <button class="btn ghost" onclick="location.href='https://wa.me/?text='+encodeURIComponent(window._share)">📲 שיתוף התוצאות בוואטסאפ</button>
  </div>
  <div class="card hd2">${rows.length?rows.map(x=>`<div class="r"><span>${esc(x.u.name)}${x.r.note?`<span class="nt">„${esc(x.r.note)}“</span>`:''}</span><span class="vv">${show(x.r.v,t)} <span class="${x.c.k}">${tag(x.c,t)}</span></span></div>`).join(''):'<div class="empty">עוד אף אחד לא כתב תוצאה ליום הזה</div>'}</div>`;
}

// ===== הפעלה =====
async function boot(){
  await loadEvents();
  if(COACH){ VIEW='coach'; }
  else if(ME){ try{ USER=await getUser(ME); if(!USER) ME=null; }catch(e){ toast('⚠️ אין חיבור'); } }
  render();
}
boot();
const f=document.createElement('div'); f.className='foot'; f.innerHTML='<button onclick="coachLogin()">🔒 כניסת מאמן</button>'; document.body.appendChild(f);
</script>
</body>
